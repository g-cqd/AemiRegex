name: CI

on:
  push:
    branches: [main]
  pull_request:
  merge_group:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci:
    uses: g-cqd/swift-ci/.github/workflows/swift-ci.yml@1da0e4043a03b3eaf5f053b8b4ecad5c1f68fae3 # swift-ci 1da0e40
    permissions:
      contents: write # required by the reusable workflow; this library does not publish archives

  golden-fixture:
    name: Golden fixture matches Go
    # The expected values in re2-golden.jsonl come from Go's regexp package. Regenerating them must change nothing: a diff means
    # the fixture was edited by hand, or Go's behaviour changed (Go 1.27 already differs from RE2 on duplicate group names).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@v7
        with:
          go-version: "1.27"
      - name: Regenerate and compare
        run: |
          go run Scripts/golden/gen.go > /tmp/re2-golden.jsonl
          diff -u Tests/AemiRegexTests/Resources/re2-golden.jsonl /tmp/re2-golden.jsonl
          go run Scripts/golden/generated/gen.go > /tmp/re2-generated.jsonl
          diff -u Tests/AemiRegexTests/Resources/re2-generated.jsonl /tmp/re2-generated.jsonl
          mkdir -p /tmp/iregexp && go run Scripts/golden/iregexp/gen.go /tmp/iregexp
          diff -u Tests/AemiRegexTests/Resources/iregexp-grammar.jsonl /tmp/iregexp/iregexp-grammar.jsonl
          diff -u Tests/AemiRegexTests/Resources/iregexp-golden.jsonl /tmp/iregexp/iregexp-golden.jsonl
